name: potion_post
description: A cozy recipe puzzle about delivering a little magic.
publish_to: none
version: 0.12.0+23
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  google_mobile_ads: ^9.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/orders.json
    - assets/scenes/
    - assets/worlds/
    - assets/characters/
    - assets/icons/
    - assets/gardens/
    - assets/ui/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
